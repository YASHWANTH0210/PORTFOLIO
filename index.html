<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxel Portfolio</title>
<style>
:root{box-sizing:border-box;--fg:#fff;--panel:rgba(20,20,26,.88);--edge:#5a5a6a;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#87ceeb}
body{font-family:"Courier New",ui-monospace,monospace;color:var(--fg)}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.75}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{top:8px;left:0;height:2px;width:18px}
#prompt{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--edge);padding:8px 14px;font-size:14px;display:none;text-align:center}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,90vw);max-height:76vh;overflow:auto;background:var(--panel);border:3px solid var(--edge);padding:20px;display:none;pointer-events:auto}
#panel h2{font-size:20px;margin-bottom:12px;color:#7fff7f;letter-spacing:1px}
#panel p,#panel li{font-size:14px;line-height:1.7;margin-bottom:8px}
#panel ul{padding-left:20px}
#panel .close{margin-top:14px;background:#3a3a46;border:2px solid var(--edge);color:#fff;padding:7px 14px;font:inherit;cursor:pointer}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,16,.92);text-align:center;padding:24px;z-index:9}
#start h1{font-size:clamp(24px,6vw,44px);letter-spacing:2px;margin-bottom:10px;text-shadow:3px 3px 0 #2a2a2a}
#start p{font-size:14px;line-height:1.9;opacity:.85;max-width:420px}
#play{margin-top:22px;background:#6aa84f;border:3px solid #3d6b2c;color:#fff;font:inherit;font-size:18px;padding:12px 30px;cursor:pointer}
#play:active{transform:translateY(2px)}
#tip{position:absolute;left:12px;top:12px;font-size:12px;opacity:.6;line-height:1.6;text-shadow:1px 1px 0 #000}
#clock{position:absolute;right:14px;top:14px;font-size:13px;background:var(--panel);border:2px solid var(--edge);padding:5px 10px}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px;font-size:11px}
#hotbar span{background:rgba(20,20,26,.8);border:2px solid var(--edge);padding:6px 9px;opacity:.65}
#hotbar span.on{border-color:#fff;opacity:1;background:rgba(90,120,70,.9)}
#panel a{color:#7fd6ff}
.stick{position:absolute;bottom:26px;width:110px;height:110px;border:2px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:auto;display:none}
#stick{left:20px}#nub{position:absolute;left:35px;top:35px;width:40px;height:40px;background:rgba(255,255,255,.4);border-radius:50%}
#jump{right:20px;bottom:26px;position:absolute;width:74px;height:74px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(255,255,255,.15);pointer-events:auto;display:none;color:#fff;font:inherit}
</style>
</head>
<body>
<div id="hud">
  <div id="cross"></div>
  <div id="tip">WASD move · Mouse look · Space jump · F fly<br>Right-click place block · 1-5 pick · Q undo</div>
  <div id="clock">☀ Day</div>
  <div id="hotbar"></div>
  <div id="prompt"></div>
  <div id="panel"><h2></h2><div class="body"></div><button class="close">Close [E]</button></div>
  <div class="stick" id="stick"><div id="nub"></div></div>
  <button id="jump">▲</button>
</div>
<div id="start">
  <h1>VOXEL PORTFOLIO</h1>
  <p>A fully explorable 3D block world. Walk up to the glowing pillars to open each section.</p>
  <button id="play">ENTER WORLD</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==== EDIT YOUR CONTENT HERE ==== */
const PORTFOLIO=[
 {t:"ABOUT ME",npc:"Welcome to my world, traveller!",c:"<p>Hey, I'm <b>YASHWANTH</b>.</p><p>B.Tech 1st Year student at <b>NIAT</b>, learning to build things for the web one block at a time.</p><p>I like turning ideas into working sites — cricket stats, study tools, and now this voxel world.</p>",x:14,z:-14,col:0xffd21e},
 {t:"SKILLS",npc:"Every build starts with a good foundation.",c:"<ul><li><b>HTML</b> — structure &amp; semantics</li><li><b>CSS</b> — layout, responsive design</li><li><b>Python</b> — logic, scripting, problem solving</li></ul><p>Currently levelling up: JavaScript and backend basics.</p>",x:-18,z:-14,col:0xff7043},
 {t:"PROJECTS",npc:"The framed builds behind me are live — go click them!",c:"<ul><li><b>INSIDECRICKET</b> — a cricket hub built with HTML &amp; CSS.<br><a href='https://yashwanth0210.github.io/INSIDECRICKET/' target='_blank' rel='noopener'>Open project →</a></li><li><b>STUDYROOMS</b> — a study-rooms front end deployed on Vercel.<br><a href='https://study-room-frontend-one.vercel.app/' target='_blank' rel='noopener'>Open project →</a></li></ul>",x:-16,z:14,col:0x4fc3f7},
 {t:"EDUCATION",npc:"First year, infinite blocks to place.",c:"<p><b>B.Tech — 1st Year</b><br>NIAT (NxtWave Institute of Advanced Technologies)</p><p>Focus: web development fundamentals, programming logic, and building real projects alongside coursework.</p>",x:16,z:16,col:0x7cb342},
 {t:"CONTACT",npc:"Ping me anytime — I reply fast.",c:"<p>📧 <a href='mailto:yashwanthboppe@gmail.com'>yashwanthboppe@gmail.com</a></p><p>💻 <a href='https://github.com/YASHWANTH0210' target='_blank' rel='noopener'>github.com/YASHWANTH0210</a></p><p>📸 <a href='https://instagram.com/ft.yashv_' target='_blank' rel='noopener'>@ft.yashv_</a></p>",x:-2,z:22,col:0xab47bc}
];
const FRAMES=[
 {t:"INSIDECRICKET",s:"HTML · CSS",u:"https://yashwanth0210.github.io/INSIDECRICKET/",c1:"#0b3d2e",c2:"#4fc3f7",x:-13,z:18},
 {t:"STUDYROOMS",s:"HTML · CSS · Vercel",u:"https://study-room-frontend-one.vercel.app/",c1:"#2a1f4d",c2:"#ffd21e",x:-19,z:18}
];
/* ================================ */

const T=THREE, scene=new T.Scene();
scene.background=new T.Color(0x9bd7f5); scene.fog=new T.Fog(0x9bd7f5,40,95);
const cam=new T.PerspectiveCamera(72,innerWidth/innerHeight,.1,220);
const rnd=new T.WebGLRenderer({antialias:false}); rnd.setPixelRatio(Math.min(devicePixelRatio,1.5));
rnd.setSize(innerWidth,innerHeight); document.body.appendChild(rnd.domElement);
const hemi=new T.HemisphereLight(0xffffff,0x6b7a5a,.95); scene.add(hemi);
const sun=new T.DirectionalLight(0xfff3d0,.75); sun.position.set(30,60,20); scene.add(sun);

/* ---- pixel textures ---- */
function tex(f){const c=document.createElement("canvas");c.width=c.height=16;const g=c.getContext("2d");f(g);
 const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;t.minFilter=T.NearestFilter;return t;}
function noise(g,base,vars){g.fillStyle=base;g.fillRect(0,0,16,16);
 for(let i=0;i<70;i++){g.fillStyle=vars[(Math.random()*vars.length)|0];g.fillRect((Math.random()*16)|0,(Math.random()*16)|0,1,1);}}
const TX={
 grassTop:tex(g=>noise(g,"#5d9c3a",["#6cb043","#4f8a30","#79bd4c"])),
 grassSide:tex(g=>{noise(g,"#8b6239",["#7a5430","#9a6f43"]);g.fillStyle="#5d9c3a";g.fillRect(0,0,16,4);
   for(let i=0;i<16;i++)g.fillRect(i,4,1,(Math.random()*3)|0);}),
 dirt:tex(g=>noise(g,"#8b6239",["#7a5430","#9a6f43","#6d4a2a"])),
 stone:tex(g=>noise(g,"#8a8a8a",["#7a7a7a","#9a9a9a","#6e6e6e"])),
 plank:tex(g=>{noise(g,"#b1854d",["#a3793f","#c0935a"]);g.fillStyle="#8d6836";
   [0,4,8,12].forEach(y=>g.fillRect(0,y,16,1));}),
 log:tex(g=>{noise(g,"#6b4f2a",["#5c4324","#7d5d33"]);g.fillStyle="#543d20";g.fillRect(3,0,1,16);g.fillRect(11,0,1,16);}),
 leaf:tex(g=>noise(g,"#3f7d2c",["#356b24","#4c9435","#2c5c1e"])),
 sand:tex(g=>noise(g,"#ded29a",["#cfc289","#eadfae"])),
 glow:tex(g=>{noise(g,"#ffe08a",["#ffd45c","#fff3c4"]);})
};
const M={}; for(const k in TX) M[k]=new T.MeshLambertMaterial({map:TX[k]});
M.water=new T.MeshLambertMaterial({color:0x3f7fd6,transparent:true,opacity:.7});

/* ---- world generation ---- */
const R=40, solid=new Set(), buckets={};
const key=(x,y,z)=>x+","+y+","+z;
function put(x,y,z,t,pass){ (buckets[t]=buckets[t]||[]).push([x,y,z]); if(!pass) solid.add(key(x,y,z)); }
function isSolid(x,y,z){return solid.has(key(x,y,z));}
function hAt(x,z){
 let h=5+Math.sin(x*.19)*2.4+Math.cos(z*.23)*2.1+Math.sin((x+z)*.11)*1.6;
 const d=Math.hypot(x,z); if(d<7) h=6; // flat plaza
 return Math.max(1,Math.round(h));
}
const SEA=4;
for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){
 const h=hAt(x,z), beach=h<=SEA+1;
 for(let y=0;y<=h;y++){
  const t = y===h ? (beach?"sand":"grassTop") : (y>h-3?"dirt":"stone");
  put(x,y,z, t==="grassTop"?"grassSide":t);
 }
 if(h<SEA) for(let y=h+1;y<=SEA;y++) put(x,y,z,"water",true);
}
// grass top caps
const caps=[];
for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){const h=hAt(x,z); if(h>SEA+1) caps.push([x,h,z]);}
// trees
let seed=7; const rr=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<26;i++){
 const x=Math.round((rr()*2-1)*(R-4)), z=Math.round((rr()*2-1)*(R-4));
 if(Math.hypot(x,z)<11) continue; const h=hAt(x,z); if(h<=SEA+1) continue;
 const th=4+((rr()*2)|0);
 for(let y=1;y<=th;y++) put(x,h+y,z,"log");
 for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=th-1;dy<=th+1;dy++){
  const r=Math.abs(dx)+Math.abs(dz)+Math.max(0,dy-th);
  if(r>3||(dx===0&&dz===0&&dy<=th)) continue;
  if(!isSolid(x+dx,h+dy,z+dz)) put(x+dx,h+dy,z+dz,"leaf");
 }
}
// plaza floor
for(let x=-6;x<=6;x++)for(let z=-6;z<=6;z++) if(Math.hypot(x,z)<6.5) put(x,6,z,"plank");

/* ---- buildings ---- */
function house(ox,oz,w,d,ht,wall){
 const b=hAt(ox,oz);
 for(let x=0;x<w;x++)for(let z=0;z<d;z++)for(let y=0;y<=ht;y++){
  const edge=(x===0||z===0||x===w-1||z===d-1);
  const X=ox+x,Z=oz+z,Y=b+y;
  if(y===0){put(X,Y,Z,"plank");continue;}
  if(!edge) continue;
  const door=(z===0&&x===((w/2)|0)&&y<3);
  const win=(y===2&&((x%3===1&&(z===0||z===d-1))||(z%3===1&&(x===0||x===w-1))));
  if(door) continue;
  put(X,Y,Z, win?"glow":(y===ht?"log":wall));
 }
 for(let y=1;y<=Math.min(w,d)/2;y++){ // roof
  for(let x=y-1;x<w-y+1;x++)for(let z=y-1;z<d-y+1;z++){
   if(x<y||z<y||x>=w-y||z>=d-y||y===((Math.min(w,d)/2)|0)) put(ox+x,b+ht+y,oz+z,"log");
  }
 }
 // torch corners
 put(ox-1,b+1,oz-1,"glow"); put(ox+w,b+1,oz+d,"glow");
}
house(24,-6,9,7,4,"stone"); house(-30,2,8,8,4,"plank"); house(4,-30,10,7,5,"stone"); house(-8,28,7,7,4,"plank");
// lamp posts along the plaza ring
for(let a=0;a<8;a++){const x=Math.round(Math.cos(a/8*6.283)*9),z=Math.round(Math.sin(a/8*6.283)*9),b=hAt(x,z);
 for(let y=1;y<=3;y++)put(x,b+y,z,"log"); put(x,b+4,z,"glow");}
// watchtower
{const ox=30,oz=28,b=hAt(ox,oz);
 for(let y=1;y<=12;y++)for(let dx=0;dx<4;dx++)for(let dz=0;dz<4;dz++){
  const edge=(dx===0||dz===0||dx===3||dz===3);
  if(edge&&!(y%4===0&&dx%3===0&&dz%3===0)) put(ox+dx,b+y,oz+dz,y>10?"glow":"stone");
  if(y===12&&!edge) put(ox+dx,b+y,oz+dz,"plank");}
}

/* ---- stations ---- */
const stations=[];
PORTFOLIO.forEach(p=>{
 const h=hAt(p.x,p.z);
 for(let y=1;y<=3;y++)for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)
   if(Math.abs(dx)+Math.abs(dz)!==0||y<3){ if(Math.abs(dx)+Math.abs(dz)<=1&&!isSolid(p.x+dx,h+y,p.z+dz)) put(p.x+dx,h+y,p.z+dz,y===3?"glow":"plank"); }
 // path marker base
 for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++) if(Math.hypot(dx,dz)<2.4&&!isSolid(p.x+dx,h+1,p.z+dz)) put(p.x+dx,h,p.z+dz,"plank");
 // sign sprite
 const c=document.createElement("canvas");c.width=256;c.height=72;const g=c.getContext("2d");
 g.fillStyle="#2b2b33";g.fillRect(0,0,256,72);g.fillStyle="#"+p.col.toString(16).padStart(6,"0");
 g.fillRect(0,0,256,5);g.fillRect(0,67,256,5);
 g.font="bold 30px Courier New";g.fillStyle="#fff";g.textAlign="center";g.fillText(p.t,128,48);
 const st=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));
 st.position.set(p.x+.5,h+5.2,p.z+.5); st.scale.set(4.2,1.2,1); scene.add(st);
 const light=new T.PointLight(p.col,1.1,14); light.position.set(p.x+.5,h+4,p.z+.5); scene.add(light);
 stations.push({...p,y:h,sprite:st});
});

/* ---- build instanced meshes ---- */
const box=new T.BoxGeometry(1,1,1), mtx=new T.Matrix4();
for(const t in buckets){
 const arr=buckets[t], im=new T.InstancedMesh(box,M[t],arr.length);
 arr.forEach((b,i)=>{mtx.setPosition(b[0]+.5,b[1]+.5,b[2]+.5);im.setMatrixAt(i,mtx);});
 im.instanceMatrix.needsUpdate=true; scene.add(im);
}
const pg=new T.PlaneGeometry(1,1); pg.rotateX(-Math.PI/2);
const capMesh=new T.InstancedMesh(pg,new T.MeshLambertMaterial({map:TX.grassTop}),caps.length);
caps.forEach((b,i)=>{mtx.setPosition(b[0]+.5,b[1]+1.002,b[2]+.5);capMesh.setMatrixAt(i,mtx);});
scene.add(capMesh);
// clouds
for(let i=0;i<14;i++){
 const w=4+((rr()*7)|0),d=3+((rr()*6)|0);
 const m=new T.Mesh(new T.BoxGeometry(w,1,d),new T.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.85}));
 m.position.set((rr()*2-1)*70,26+rr()*8,(rr()*2-1)*70); scene.add(m);
}

/* ---- project frames ---- */
const frames=[];
FRAMES.forEach(f=>{
 const b=hAt(f.x,f.z);
 for(let dx=-2;dx<=2;dx++)for(let y=0;y<=4;y++) if(Math.abs(dx)===2||y===0||y===4) put(f.x+dx,b+y,f.z+2,"log");
 const c=document.createElement("canvas");c.width=320;c.height=200;const g=c.getContext("2d");
 const grad=g.createLinearGradient(0,0,320,200);grad.addColorStop(0,f.c1);grad.addColorStop(1,"#101018");
 g.fillStyle=grad;g.fillRect(0,0,320,200);
 g.fillStyle=f.c2;g.fillRect(0,0,320,8);
 for(let i=0;i<40;i++){g.fillStyle="rgba(255,255,255,"+(Math.random()*.08)+")";g.fillRect((Math.random()*320)|0,(Math.random()*200)|0,10,10);}
 g.fillStyle="#fff";g.font="bold 26px Courier New";g.textAlign="center";g.fillText(f.t,160,104);
 g.font="15px Courier New";g.fillStyle=f.c2;g.fillText(f.s,160,134);
 g.fillStyle="#fff";g.font="13px Courier New";g.fillText("[ click frame to open ]",160,170);
 const m=new T.Mesh(new T.PlaneGeometry(4,2.6),new T.MeshBasicMaterial({map:new T.CanvasTexture(c)}));
 m.position.set(f.x+.5,b+2.5,f.z+1.45); scene.add(m);
 const fl=new T.PointLight(0xffffff,.7,11); fl.position.set(f.x+.5,b+3,f.z); scene.add(fl);
 frames.push({...f,y:b+2.5,mesh:m});
});

/* ---- NPCs ---- */
const npcs=[];
const skin=new T.MeshLambertMaterial({color:0xd8a06a}), robe=new T.MeshLambertMaterial({color:0x7a4a2b});
PORTFOLIO.forEach((p,i)=>{
 const g=new T.Group(), b=hAt(p.x+3,p.z+3);
 const body=new T.Mesh(new T.BoxGeometry(.55,.85,.32),robe); body.position.y=.95; g.add(body);
 const head=new T.Mesh(new T.BoxGeometry(.48,.48,.48),skin); head.position.y=1.63; g.add(head);
 const nose=new T.Mesh(new T.BoxGeometry(.14,.2,.16),skin); nose.position.set(0,1.58,.25); g.add(nose);
 const la=new T.Mesh(new T.BoxGeometry(.16,.7,.16),robe); la.position.set(-.35,.98,0); g.add(la);
 const ra=la.clone(); ra.position.x=.35; g.add(ra);
 const lg=new T.Mesh(new T.BoxGeometry(.2,.55,.2),new T.MeshLambertMaterial({color:0x40506b}));
 lg.position.set(-.15,.28,0); g.add(lg);
 const rg=lg.clone(); rg.position.x=.15; g.add(rg);
 g.position.set(p.x+3.5,b+1,p.z+3.5); scene.add(g);
 const c=document.createElement("canvas");c.width=512;c.height=64;const q=c.getContext("2d");
 q.fillStyle="rgba(15,15,20,.85)";q.fillRect(0,0,512,64);q.fillStyle="#fff";q.font="20px Courier New";q.textAlign="center";
 q.fillText(p.npc,256,40);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));
 sp.scale.set(5,.62,1); sp.position.set(g.position.x,b+3,g.position.z); sp.visible=false; scene.add(sp);
 npcs.push({g,sp,la,ra,base:b+1,i});
});

/* ---- fish & birds ---- */
const fish=[],birds=[];
const fishMat=[0xffa726,0x4dd0e1,0xef5350,0xf5f5f5];
(buckets.water||[]).filter((_,i)=>i%9===0).slice(0,26).forEach((w,i)=>{
 const g=new T.Group();
 const b=new T.Mesh(new T.BoxGeometry(.42,.26,.18),new T.MeshLambertMaterial({color:fishMat[i%4]}));g.add(b);
 const t=new T.Mesh(new T.BoxGeometry(.18,.24,.06),new T.MeshLambertMaterial({color:fishMat[i%4]}));t.position.x=-.3;g.add(t);
 g.position.set(w[0]+.5,w[1]-.35,w[2]+.5); scene.add(g);
 fish.push({g,cx:w[0],cz:w[2],r:1+Math.random()*2.5,a:Math.random()*6.28,s:.5+Math.random(),y:w[1]-.2-Math.random()*.5,t});
});
for(let i=0;i<16;i++){
 const g=new T.Group(), col=[0x2b2b33,0xffffff,0x4a6fa5][i%3];
 const bd=new T.Mesh(new T.BoxGeometry(.5,.28,.3),new T.MeshLambertMaterial({color:col}));g.add(bd);
 const wl=new T.Mesh(new T.BoxGeometry(.12,.05,.8),new T.MeshLambertMaterial({color:col}));wl.position.set(0,.1,-.5);g.add(wl);
 const wr=wl.clone();wr.position.z=.5;g.add(wr);
 scene.add(g);
 birds.push({g,wl,wr,r:12+Math.random()*30,a:Math.random()*6.28,s:.16+Math.random()*.2,y:18+Math.random()*9,ox:(Math.random()*2-1)*20,oz:(Math.random()*2-1)*20});
}

/* ---- player ---- */
const P={p:new T.Vector3(.5,9,8.5),v:new T.Vector3(),ground:false,yaw:0,pitch:0,fly:false};
const K={};
addEventListener("keydown",e=>{K[e.code]=true;
 if(e.code==="KeyF")P.fly=!P.fly;
 if(e.code==="KeyE"&&open)closePanel(); if(e.code==="KeyE"&&!open&&near)openPanel(near);});
addEventListener("keyup",e=>K[e.code]=false);
const cvs=rnd.domElement;
document.getElementById("play").onclick=()=>{document.getElementById("start").style.display="none";cvs.requestPointerLock&&cvs.requestPointerLock();
 if(matchMedia("(pointer:coarse)").matches){stickEl.style.display="block";jumpEl.style.display="block";}};
cvs.addEventListener("click",()=>{if(!open)cvs.requestPointerLock&&cvs.requestPointerLock();});
addEventListener("mousemove",e=>{if(document.pointerLockElement!==cvs)return;
 P.yaw-=e.movementX*.0023; P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-e.movementY*.0023));});

/* touch */
const stickEl=document.getElementById("stick"),nub=document.getElementById("nub"),jumpEl=document.getElementById("jump");
let tv={x:0,y:0},sid=null;
stickEl.addEventListener("touchstart",e=>{sid=e.changedTouches[0].identifier;},{passive:true});
stickEl.addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier!==sid)continue;
 const r=stickEl.getBoundingClientRect(),dx=t.clientX-r.left-55,dy=t.clientY-r.top-55,d=Math.min(40,Math.hypot(dx,dy))||1;
 const a=Math.atan2(dy,dx); tv.x=Math.cos(a)*d/40; tv.y=Math.sin(a)*d/40;
 nub.style.left=35+Math.cos(a)*d+"px"; nub.style.top=35+Math.sin(a)*d+"px";}},{passive:true});
stickEl.addEventListener("touchend",()=>{tv={x:0,y:0};sid=null;nub.style.left="35px";nub.style.top="35px";},{passive:true});
jumpEl.addEventListener("touchstart",()=>{if(P.ground)P.v.y=8.4;},{passive:true});
let lid=null,lx=0,ly=0;
addEventListener("touchstart",e=>{const t=e.changedTouches[0];if(t.clientX>innerWidth*.35){lid=t.identifier;lx=t.clientX;ly=t.clientY;}},{passive:true});
addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier!==lid)continue;
 P.yaw-=(t.clientX-lx)*.005;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-(t.clientY-ly)*.005));lx=t.clientX;ly=t.clientY;}},{passive:true});
addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===lid)lid=null;},{passive:true});

function hits(p){const r=.3,ht=1.75;
 for(let x=Math.floor(p.x-r);x<=Math.floor(p.x+r);x++)
 for(let y=Math.floor(p.y);y<=Math.floor(p.y+ht);y++)
 for(let z=Math.floor(p.z-r);z<=Math.floor(p.z+r);z++) if(isSolid(x,y,z))return true;
 return false;}

/* ---- panel ---- */
const panel=document.getElementById("panel"),prompt=document.getElementById("prompt");
let near=null,nearFrame=null,open=false;
function openPanel(s){open=true;panel.style.display="block";panel.querySelector("h2").textContent=s.t;
 panel.querySelector(".body").innerHTML=s.c;document.exitPointerLock&&document.exitPointerLock();prompt.style.display="none";}
function closePanel(){open=false;panel.style.display="none";cvs.requestPointerLock&&cvs.requestPointerLock();}
panel.querySelector(".close").onclick=closePanel;
cvs.addEventListener("pointerdown",e=>{
 if(open) return;
 if(near){openPanel(near);return;}
 if(nearFrame){window.open(nearFrame.u,"_blank","noopener");return;}
 if(e.pointerType==="touch") place();
});

/* ---- block builder ---- */
const HOT=["plank","stone","log","leaf","glow"], placed=[]; let slot=0;
const hotEl=document.getElementById("hotbar");
function drawHot(){hotEl.innerHTML=HOT.map((h,i)=>'<span class="'+(i===slot?"on":"")+'">'+(i+1)+' '+h+'</span>').join("");}
drawHot();
addEventListener("keydown",e=>{
 const n=parseInt(e.key); if(n>=1&&n<=HOT.length){slot=n-1;drawHot();}
 if(e.code==="KeyQ"&&placed.length){const b=placed.pop();scene.remove(b.m);solid.delete(key(b.x,b.y,b.z));}
});
function rayTarget(){
 const d=new T.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
 let prev=null;
 for(let t=.4;t<7;t+=.12){
  const x=Math.floor(cam.position.x+d.x*t),y=Math.floor(cam.position.y+d.y*t),z=Math.floor(cam.position.z+d.z*t);
  if(isSolid(x,y,z)) return prev;
  prev=[x,y,z];
 }
 return null;
}
function place(){
 const p=rayTarget(); if(!p) return;
 if(Math.abs(p[0]-P.p.x)<.9&&Math.abs(p[2]-P.p.z)<.9&&p[1]>=Math.floor(P.p.y)&&p[1]<=Math.floor(P.p.y+1.7)) return;
 const m=new T.Mesh(box,M[HOT[slot]]); m.position.set(p[0]+.5,p[1]+.5,p[2]+.5); scene.add(m);
 solid.add(key(p[0],p[1],p[2])); placed.push({m,x:p[0],y:p[1],z:p[2]});
}
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("mousedown",e=>{
 if(open||document.pointerLockElement!==cvs) return;
 if(e.button===2) place();
 else if(nearFrame) window.open(nearFrame.u,"_blank","noopener");
});

/* ---- day / night ---- */
const SKY_DAY=new T.Color(0x9bd7f5), SKY_NIGHT=new T.Color(0x0b1030), SKY_DUSK=new T.Color(0xf29b62);
const stars=new T.Points(new T.BufferGeometry().setAttribute("position",
 new T.Float32BufferAttribute(Array.from({length:1400},()=>(Math.random()*2-1)*160),3)),
 new T.PointsMaterial({color:0xffffff,size:.9,transparent:true,opacity:0}));
scene.add(stars);
let clock=0.22; // 0..1 (0.25 = noon)
function sky(dt){
 clock=(clock+dt/150)%1;
 const day=Math.sin(clock*6.283)*.5+.5;           // 1 = noon, 0 = midnight
 const dusk=Math.pow(1-Math.abs(day*2-1),6);
 const c=SKY_NIGHT.clone().lerp(SKY_DAY,day).lerp(SKY_DUSK,dusk*.7);
 scene.background=c; scene.fog.color=c;
 sun.position.set(Math.cos(clock*6.283)*80,Math.sin(clock*6.283)*80,25);
 sun.intensity=.15+day*.7; hemi.intensity=.25+day*.7;
 stars.material.opacity=Math.max(0,1-day*2.2); stars.rotation.y+=dt*.005;
 document.getElementById("clock").textContent=(day>.55?"☀ Day":day>.2?"🌇 Dusk":"🌙 Night");
}
let last=performance.now();
function tick(now){
 requestAnimationFrame(tick);
 const dt=Math.min(.05,(now-last)/1000); last=now;
 if(!open){
  const sp=(P.fly?11:5.2), f=(K.KeyW?1:0)-(K.KeyS?1:0)-tv.y, s=(K.KeyD?1:0)-(K.KeyA?1:0)+tv.x;
  const dir=new T.Vector3(Math.sin(P.yaw)*-f+Math.cos(P.yaw)*s,0,Math.cos(P.yaw)*-f-Math.sin(P.yaw)*s);
  if(dir.lengthSq()>0)dir.normalize().multiplyScalar(sp*dt);
  const np=P.p.clone(); np.x+=dir.x; if(hits(np))np.x=P.p.x;
  np.z+=dir.z; if(hits(np))np.z=P.p.z; P.p.x=np.x; P.p.z=np.z;
  if(P.fly){P.v.y=(K.Space?1:0)*9-(K.ShiftLeft?1:0)*9;}
  else{P.v.y-=24*dt; if(K.Space&&P.ground)P.v.y=8.4;}
  const ny=P.p.clone(); ny.y+=P.v.y*dt;
  if(hits(ny)){ if(P.v.y<0)P.ground=true; P.v.y=0; } else { P.p.y=ny.y; P.ground=false; }
  if(P.p.y<-8){P.p.set(.5,12,8.5);P.v.set(0,0,0);}
 }
 cam.position.set(P.p.x,P.p.y+1.62,P.p.z);
 cam.rotation.set(0,0,0); cam.rotateY(P.yaw); cam.rotateX(P.pitch);
 sky(dt);
 const tt=now/1000;
 fish.forEach(f=>{f.a+=dt*f.s; f.g.position.set(f.cx+.5+Math.cos(f.a)*f.r,f.y+Math.sin(tt+f.cx)*.12,f.cz+.5+Math.sin(f.a)*f.r);
  f.g.rotation.y=-f.a+Math.PI/2; f.t.rotation.y=Math.sin(tt*8+f.cx)*.5;});
 birds.forEach(b=>{b.a+=dt*b.s; b.g.position.set(b.ox+Math.cos(b.a)*b.r,b.y+Math.sin(tt*.7+b.r)*1.4,b.oz+Math.sin(b.a)*b.r);
  b.g.rotation.y=-b.a; const f=Math.sin(tt*9+b.r)*.7; b.wl.rotation.x=f; b.wr.rotation.x=-f;});
 npcs.forEach(n=>{const d=Math.hypot(P.p.x-n.g.position.x,P.p.z-n.g.position.z);
  n.g.position.y=n.base+Math.sin(tt*1.6+n.i)*.05;
  n.g.rotation.y=Math.atan2(P.p.x-n.g.position.x,P.p.z-n.g.position.z);
  const sw=Math.sin(tt*2+n.i)*.25; n.la.rotation.x=sw; n.ra.rotation.x=-sw;
  n.sp.visible=d<7;});
 nearFrame=null;
 for(const f of frames){const d=Math.hypot(P.p.x-f.x-.5,P.p.z-f.z); if(d<4.5) nearFrame=f;}
 near=null; let bd=4.8;
 for(const s of stations){const d=Math.hypot(P.p.x-s.x-.5,P.p.z-s.z-.5); if(d<bd){bd=d;near=s;}
  s.sprite.position.y=s.y+5.2+Math.sin(now/600+s.x)*.12;}
 if(!open){
  const touch=matchMedia("(pointer:coarse)").matches;
  prompt.style.display=(near||nearFrame)?"block":"none";
  if(near)prompt.textContent="["+(touch?"TAP":"E / CLICK")+"] open "+near.t;
  else if(nearFrame)prompt.textContent="["+(touch?"TAP":"CLICK")+"] visit "+nearFrame.t;
 }
 rnd.render(scene,cam);
}
requestAnimationFrame(tick);
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight);});
</script>
